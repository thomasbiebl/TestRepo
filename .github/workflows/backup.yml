name: Datenbank-Backup

# Der kostenlose Supabase-Tarif enthält keine Backups. Dieser Job sichert wöchentlich die Daten
# und legt sie verschlüsselt als Artefakt ab (90 Tage). Das Repo ist öffentlich, deshalb nie unverschlüsselt!
# Einrichtung: docs/SUPABASE.md, Abschnitt "Backup".

on:
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Daten sichern und verschlüsseln
        if: env.DB_URL != '' && env.PASSPHRASE != ''
        run: |
          set -euo pipefail
          docker run --rm postgres:17 pg_dump "$DB_URL" --no-owner --no-privileges --schema=public > public.sql
          docker run --rm postgres:17 pg_dump "$DB_URL" --no-owner --no-privileges --data-only \
            --table=auth.users --table=auth.identities > auth.sql
          tar czf backup.tgz public.sql auth.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "backup-$(date +%F).tgz.gpg" backup.tgz
          rm -f public.sql auth.sql backup.tgz
      - name: Backup hochladen
        if: env.DB_URL != '' && env.PASSPHRASE != ''
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.tgz.gpg
          retention-days: 90
